<circle cx="615" cy="162" r="20" fill="#0072B2"/>
<text x="615.0" y="169.0" text-anchor="middle" font-size="18" font-weight="700" fill="white">1</text>
<text x="650.0" y="165.0" text-anchor="start" font-size="18" font-weight="700" fill="#222222">Directly structure</text>
<text x="650.0" y="196.0" text-anchor="start" font-size="16" font-weight="400" fill="#222222">Explicit receptor status</text>
<text x="650.0" y="222.0" text-anchor="start" font-size="16" font-weight="400" fill="#222222">Completed test result</text>
