<text x="397.5" y="327.5" text-anchor="middle" font-size="16" font-weight="700" fill="#222222">Inference harness</text>
<text x="397.5" y="347.5" text-anchor="middle" font-size="16" font-weight="400" fill="#222222">structured fields</text>
<text x="397.5" y="367.5" text-anchor="middle" font-size="16" font-weight="400" fill="#222222">+ supporting excerpts</text>
