<text x="650.0" y="505.0" text-anchor="start" font-size="18" font-weight="700" fill="#222222">Escalate for clinical interpretation</text>
<text x="650.0" y="536.0" text-anchor="start" font-size="16" font-weight="400" fill="#222222">Treatment response</text>
<text x="650.0" y="562.0" text-anchor="start" font-size="16" font-weight="400" fill="#222222">Uncertain metastatic disease</text>
<line x1="510.0" y1="342.0" x2="575.0" y2="527.0" stroke="#009E73" stroke-width="2.2" marker-end="url(#arrow-green)"/>
<path d="M1325,130 h28 v455 h-28" fill="none" stroke="#009E73" stroke-width="4"/>
<text x="1385.0" y="330.0" text-anchor="middle" font-size="17" font-weight="700" fill="#009E73">Physician</text>
