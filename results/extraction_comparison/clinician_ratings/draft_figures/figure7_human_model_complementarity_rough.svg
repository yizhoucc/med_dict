<text x="175.0" y="653.0" text-anchor="start" font-size="16" font-weight="400" fill="#0072B2">Largest net margin: Active anticancer medications (+80.6%)</text>
<rect x="695.0" y="600.0" width="515.0" height="72.0" rx="9" fill="#F7F9FA" stroke="#D7DEE3" stroke-width="1.5"/>
<text x="720.0" y="628.0" text-anchor="start" font-size="16" font-weight="700" fill="#222222">Observed core-field range</text>
<text x="720.0" y="653.0" text-anchor="start" font-size="16" font-weight="400" fill="#5E6870">Smallest net margin: Distant metastasis (+11.2%)</text>
<text x="750.0" y="704.0" text-anchor="middle" font-size="16" font-weight="400" fill="#5E6870">Conceptual interpretation only; time, workload, and risk were not measured</text>
