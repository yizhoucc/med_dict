<text x="615.0" y="339.0" text-anchor="middle" font-size="18" font-weight="700" fill="white">2</text>
<text x="650.0" y="335.0" text-anchor="start" font-size="18" font-weight="700" fill="#222222">Reconcile and surface evidence</text>
<text x="650.0" y="366.0" text-anchor="start" font-size="16" font-weight="400" fill="#222222">Active medications and plans</text>
<text x="650.0" y="392.0" text-anchor="start" font-size="16" font-weight="400" fill="#222222">Long histories; stage and metastasis</text>
