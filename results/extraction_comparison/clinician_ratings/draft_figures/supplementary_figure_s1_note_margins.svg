 <title id="figure-title">Note level preference margins</title><desc id="figure-description">Note level preference margins are positive for all 20 breast cancer notes and 19 of 20 PDAC notes; one PDAC note is negative and none are at the reference line. Position, marker direction, and color provide redundant encoding.</desc><metadata>
