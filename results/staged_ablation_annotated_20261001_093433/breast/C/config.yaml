  extraction:
    Cancer_Diagnosis: "EXTRACTION OVER INFERENCE — read before the task below:\n1.\
      \ Extract what the note actually states for this field. Do not summarize it\
      \ away or infer a conclusion the note does not support.\n2. When you are NOT\
      \ confident, do NOT force a tidy 'none / no / not mentioned / no change' answer.\
      \ If the note contains anything relevant to this field, extract and list that\
      \ concrete detail and let the reader judge. Only use a 'none'/'not mentioned'\
      \ fallback when the note genuinely contains nothing for this field.\n3. When\
      \ you do make an inference you are confident about, put it in (parentheses)\
      \ so it is clearly marked as inferred rather than stated in the note.\n\nTASK:\
      \ Extract cancer diagnosis details.\n\nFor Type_of_Cancer, be MAXIMALLY SPECIFIC\
      \ — include ALL of the following that the note provides:\n1. Histologic subtype:\
      \ IDC (invasive ductal carcinoma), ILC (invasive lobular carcinoma), DCIS, mixed,\
      \ etc.\n2. Receptor status — ER, PR, and HER2, preserving exact percentages\
      \ and low-positive results. e.g., \"ER 95%/PR 5%/HER2-\"\n3. Grade (e.g., \"\
      grade 2\", \"G3\", \"high grade\") — ALWAYS include if mentioned anywhere in\
      \ the note\n4. Special features: micropapillary, mucinous, neuroendocrine differentiation,\
      \ squamous differentiation, etc.\n5. Associated DCIS if present (e.g., \"with\
      \ extensive DCIS\", \"with high-grade DCIS component\")\n6. If receptor status\
      \ changed between original diagnosis and metastatic/recurrent biopsy, note BOTH\
      \ with clear timepoint/site labels.\n7. If this is a recurrence or metastatic\
      \ disease, mention that (e.g., \"with metastatic recurrence to [site]\")\n-\
      \ Example: \"ER+/PR+/HER2- grade 2 invasive ductal carcinoma with extensive\
      \ DCIS\" NOT just \"ER+/PR+/HER2- IDC\"\n- Example with recurrence: \"ER+/PR+/HER2-\
      \ IDC (micropapillary features) with metastatic recurrence (left cervical LN)\"\
      \nDo NOT write just \"breast cancer\" or \"MBC\" — always include the subtype,\
      \ receptor status, grade, and special features when available in the note.\n\
      CRITICAL — KEEP EVERY RECEPTOR PROFILE SCOPED TO ITS OWN TUMOR/SPECIMEN:\n-\
      \ First identify the laterality, lesion/site, and timepoint for each pathology\
      \ result. Never combine ER from one lesion with PR or HER2 from another lesion.\n\
      - For bilateral or multifocal disease, report each distinct tumor separately\
      \ with its side and lesion/site label, separated by semicolons. Example: \"\
      Left lesion: ER+/PR+/HER2- IDC; Right lesion: ER-/PR-/HER2+ IDC.\"\n- For longitudinal\
      \ disease, report the current recurrent/metastatic biopsy first and label the\
      \ original result separately. Example: \"Current liver metastasis: ER-/PR-/HER2-;\
      \ original breast primary: ER+/PR+/HER2-.\"\n- \"Most recent pathology takes\
      \ priority\" applies only to repeated specimens from the SAME tumor lineage.\
      \ It must never erase or merge simultaneous bilateral/multifocal tumors.\n-\
      \ If a receptor result cannot be confidently linked to a particular lesion or\
      \ timepoint, leave that receptor unstated for that lesion rather than guessing\
      \ or borrowing another profile.\nIMPORTANT: Search the ENTIRE note for receptor\
      \ status, but include each result only with the breast tumor/specimen it actually\
      \ describes. A receptor mentioned in PMH or older pathology must be labeled\
      \ historical unless the note clearly establishes it as current.\nIMPORTANT:\
      \ If the Assessment/Plan says \"HR+\" or \"hormone receptor positive\", this\
      \ means ER+. If it says \"her 2 negative\" or \"HER2-\" or \"*****-\", this\
      \ means HER2 NEGATIVE. Do NOT write \"not specified\" when the A/P explicitly\
      \ states receptor status.\nCRITICAL — ER/PR PRECISION: Preserve the exact reported\
      \ result, including percentages, ranges, and \"low-positive\" wording (e.g.,\
      \ \"ER 1%\", \"PR <5%\", \"PR 1-10%\"). Do NOT round a low-positive result down\
      \ to negative or collapse it to a generic \"+\". Do NOT assume PR+ merely because\
      \ the cancer is called HR+; only report a receptor result that is explicitly\
      \ supported for that specimen.\n\nHER2 status rules — follow strictly:\n- If\
      \ the note explicitly states a HER2 result, bind it to the correct lesion/timepoint\
      \ and report the FINAL interpretation, not merely the preliminary IHC score.\n\
      - If HER2 was NOT tested or NOT mentioned for that lesion, write \"HER2: not\
      \ tested\" — never invent HER2-negative or HER2-positive and never borrow another\
      \ lesion's result.\n- DCIS (ductal carcinoma in situ) often does NOT have HER2\
      \ testing. Do NOT assume HER2- for DCIS unless explicitly stated.\n- HER2 IHC\
      \ scoring — use this table to determine HER2 status:\n  IHC 0     = HER2 NEGATIVE\n\
      \  IHC 1+    = HER2 NEGATIVE\n  IHC 2+    = EQUIVOCAL — must check the linked\
      \ FISH/ISH result:\n    IHC 2+ with FISH amplified, ratio ≥ 2.0, or gene copies\
      \ ≥ 6 = HER2 POSITIVE\n    IHC 2+ with FISH non-amplified/negative or ratio\
      \ < 2.0       = HER2 NEGATIVE\n    IHC 2+ with FISH pending/not resulted   \
      \                     = HER2 EQUIVOCAL (FISH pending)\n  IHC 3+    = HER2 POSITIVE\n\
      - FISH interpretation (when reported without IHC):\n  FISH ratio ≥ 2.0 = amplified\
      \ = HER2 POSITIVE\n  FISH ratio < 2.0 = not amplified = HER2 NEGATIVE\n- IMPORTANT:\
      \ Anti-HER2 treatment supports HER2+ only when it is explicitly current and\
      \ clearly linked to this breast tumor. Never use a historical, conditional,\
      \ or other-cancer drug mention to assign HER2 status.\n- IMPORTANT: If the note\
      \ says \"triple negative\" ANYWHERE (HPI, A/P, diagnosis), that means ER-/PR-/HER2-.\
      \ Write HER2 as NEGATIVE even if the HER2 IHC/FISH data is [REDACTED] or masked.\
      \ \"Triple negative\" is a definitive classification.\n- IMPORTANT: If HER2\
      \ IHC/FISH data is [REDACTED] but the Assessment/Plan writes \"[REDACTED] negative\"\
      \ in the receptor status line, infer HER2 = negative.\n- IMPORTANT: goserelin\
      \ (Zoladex) / leuprolide (Lupron) used DURING CHEMOTHERAPY for fertility preservation\
      \ does NOT indicate ER+. These drugs suppress ovaries to protect eggs during\
      \ chemo. Only infer ER+ from goserelin/Lupron when it is used as ENDOCRINE THERAPY\
      \ (adjuvant or palliative, continuous long-term use for hormone suppression).\
      \ If the note says \"goserelin for fertility preservation\" or \"goserelin during\
      \ chemotherapy\", do NOT add \"ER+ (inferred from goserelin)\".\n- IMPORTANT:\
      \ If the patient has MULTIPLE primary cancers (e.g., gastric cancer AND breast\
      \ cancer), report receptor status ONLY for the BREAST cancer. Do NOT mix receptor\
      \ status from other cancers. For example, if gastric cancer is HER2+ but breast\
      \ cancer is HER2-, write HER2- for the breast cancer.\n- TNBC CONSISTENCY CHECK:\
      \ If you classify the cancer as \"TNBC\" or \"triple negative\", the receptor\
      \ status MUST be ER-/PR-/HER2-. Do NOT write \"TNBC\" together with \"ER+\"\
      \ or \"PR+\" — that is a contradiction. If the cancer was reclassified from\
      \ HER2+ to TNBC after surgery, the FINAL classification (TNBC) takes priority.\
      \ Write: \"ER-/PR-/HER2- (TNBC; initially classified as HER2+ but reclassified\
      \ after surgical pathology)\"\n- RECEPTOR STATUS PRIORITY — when multiple biopsies\
      \ exist:\n  For serial pathology from the SAME tumor lineage (core biopsy, later\
      \ surgical specimen, recurrent/metastatic biopsy), the MOST RECENT completed\
      \ pathology takes priority for current receptor status.\n  Always report the\
      \ CURRENT receptor status first, then note the original if different. A pending\
      \ result never overrides a completed result.\n  Example: If core biopsy was\
      \ ER+/PR+/HER2- but surgical specimen after neoadjuvant shows ER+/PR-/HER2-,\
      \ write: \"ER+/PR-/HER2- (post-neoadjuvant; originally PR+)\"\n  If metastatic\
      \ biopsy shows different receptors from the primary, the metastatic biopsy is\
      \ the CURRENT status.\n- HISTOLOGIC SUBTYPE — do NOT confuse imaging with pathology:\n\
      \  \"lobular mass\" or \"lobulated mass\" on imaging describes the SHAPE of\
      \ the mass, NOT the histologic subtype.\n  Only write \"invasive lobular carcinoma\"\
      \ (ILC) if pathology explicitly says \"lobular carcinoma\" or \"ILC\".\n  If\
      \ pathology says \"adenocarcinoma\" or \"adenoCA\" without specifying ductal\
      \ or lobular, write the exact pathology term (e.g., \"Grade III adenocarcinoma\"\
      ), NOT \"invasive lobular carcinoma\".\n- REDACTED HER2 — inference rules:\n\
      \  If the note says \"[REDACTED] negative\" or \"*****-\" in the A/P receptor\
      \ status line, AND the treatment is endocrine-only (no anti-HER2 drugs), HER2\
      \ is NEGATIVE — do NOT write \"not tested\".\n  If the Problem List says \"\
      ER+PR+ *****-\", the \"*****\" is HER2 and the \"-\" means NEGATIVE.\n  Only\
      \ write \"HER2: not tested\" when there is genuinely NO mention of HER2 testing\
      \ or results anywhere in the note AND no treatment context to infer from.\n\n\
      For Stage_of_Cancer:\n- Write the AJCC/TNM stage if stated (e.g., \"Stage IIA\"\
      , \"pT2N0M0\", \"Stage IV\")\n- If the patient was originally diagnosed at one\
      \ stage but now has metastatic recurrence, write BOTH:\n  e.g., \"Originally\
      \ Stage IIA, now metastatic (Stage IV)\" (use the ACTUAL stated stage number).\n\
      \  IMPORTANT: Only state the original stage if the note EXPLICITLY gives the\
      \ original stage number (e.g., \"Stage IIA at diagnosis\"). If the original\
      \ stage is NOT stated, write just \"Metastatic (Stage IV)\". NEVER output a\
      \ literal placeholder such as \"[X]\", \"Stage [X]\", or empty brackets — if\
      \ you don't know the original stage, omit it entirely.\n- CRITICAL — ONE CANCER\
      \ ONLY: Stage ONLY the breast cancer this note is about. If the patient has\
      \ OTHER primary cancers (e.g., a prior or concurrent ovarian, colon, endometrial,\
      \ or thyroid cancer), do NOT borrow that cancer's stage or metastasis. For example,\
      \ a prior ovarian cancer that was \"Stage IIIC\" or \"metastatic to a lymph\
      \ node\" does NOT make the breast cancer Stage IV.\n- CRITICAL — LOCAL/REGIONAL\
      \ RECURRENCE IS NOT STAGE IV: A local or regional recurrence (e.g., chest wall\
      \ recurrence, regional/axillary nodal recurrence) is NOT Stage IV unless there\
      \ is CONFIRMED distant-organ metastasis. Do NOT upgrade a \"locally recurrent\"\
      \ or \"local regional recurrence\" breast cancer to Stage IV based on the recurrence\
      \ alone. If the physician explicitly says \"local regional recurrence\" with\
      \ \"no other sites of disease\", it is NOT Stage IV.\n- CRITICAL — SUSPECTED\
      \ vs CONFIRMED: If metastasis is only SUSPECTED/equivocal and not yet confirmed,\
      \ do NOT write a definitive \"Stage IV\". Write \"Suspected Stage IV (pending\
      \ confirmation)\" and include only sites actually named in the note.\n- If distant\
      \ metastases are CONFIRMED, the current stage is Stage IV even if not explicitly\
      \ stated.\n- If the Assessment/Plan states a stage (e.g., \"Stage I\", \"early\
      \ stage\"), extract it — do NOT write \"Not mentioned in note\".\n- If the note\
      \ has pTN notation (e.g., \"pT2N1\"), write the pTN notation as-is. Do NOT convert\
      \ pTN to AJCC stage names — write \"pT2N1\" not \"Stage IIB\".\n- If distant\
      \ metastasis is documented, write \"Stage IV (metastatic)\" even if the note\
      \ does not explicitly say \"Stage IV\".\n- Do NOT infer an AJCC stage number\
      \ from tumor size alone. Staging requires complete clinical assessment including\
      \ imaging, pathology, and physician judgment. If the note does not state a stage,\
      \ write \"Not staged in note\" or report only the available pTN data.\n- Only\
      \ write \"Not mentioned in note\" if there is truly NO staging or tumor information\
      \ anywhere in the note.\n\nRespond *only* with a JSON object using this exact\
      \ schema:\n{\n\"Type_of_Cancer\": \"Specific cancer type with histologic subtype\
      \ and receptor statuses when available. e.g., 'ER+/PR+/HER2- invasive ductal\
      \ carcinoma'\",\n\"Stage_of_Cancer\": \"AJCC stage, or original + current if\
      \ recurred/progressed. e.g., 'Stage IIA' or 'Originally Stage IIA, now metastatic\
      \ (Stage IV)' — only include original stage if explicitly stated; NEVER output\
      \ a literal '[X]' placeholder. CRITICAL: IPSILATERAL axillary, sentinel, supraclavicular,\
      \ infraclavicular, and internal mammary lymph nodes are REGIONAL for breast\
      \ cancer — involvement of these nodes alone is Stage III, NOT Stage IV. Contralateral\
      \ axillary/supraclavicular nodes are nonregional/distant. Only truly DISTANT\
      \ sites (liver, lung, bone, brain, pleural, peritoneal, contralateral nodes)\
      \ qualify as M1/Stage IV. Stage ONLY the breast cancer — do NOT borrow another\
      \ cancer's (ovarian/colon/etc.) stage. Local/regional recurrence is NOT Stage\
      \ IV without confirmed distant mets. If mets are only suspected/unconfirmed,\
      \ write 'Suspected Stage IV (pending confirmation)'.\",\n\"Distant Metastasis\"\
      : \"DISTANT (M1) disease only. Answer 'Yes, to [confirmed distant site(s)]',\
      \ 'No', or 'Not sure/Suspected, to [site(s)]'. Breast regional nodes — IPSILATERAL\
      \ axillary, sentinel, subpectoral, supraclavicular, infraclavicular, and internal\
      \ mammary — are NOT distant; CONTRALATERAL axillary/supraclavicular nodes are\
      \ distant. Local breast/chest-wall recurrence and direct extension into adjacent\
      \ tissue are NOT distant. Bone (including sternum, spine, ribs, femur), liver,\
      \ lung, brain, pleura, peritoneum, and nonregional nodes may be distant. Preserve\
      \ certainty separately for every site: suspicious/concerning/indeterminate/pending-biopsy\
      \ sites must remain 'Not sure' or 'Suspected', never 'Yes'. Do not include benign/negative/reactive/granulomatous/sarcoid\
      \ findings or another primary cancer's spread.\",\n\"Metastasis\": \"COMPREHENSIVE\
      \ spread status: include regional nodal involvement PLUS distant (M1) disease.\
      \ For breast cancer, only IPSILATERAL axillary/sentinel/subpectoral/supraclavicular/infraclavicular/internal-mammary\
      \ nodes are regional; contralateral axillary/supraclavicular nodes are distant.\
      \ Also include an explicitly documented locoregional/chest-wall recurrence,\
      \ but do not call recurrence confined to the breast itself a metastasis. Direct\
      \ contiguous invasion into adjacent tissue is not metastasis. Preserve each\
      \ claim's evidence level without borrowing any organ, site, procedure, or certainty\
      \ phrase from these instructions. Call regional nodes pathologically confirmed\
      \ only with p/ypN-positive staging, a positive node count, or a positive node\
      \ biopsy. Explicit imaging-described nodal metastases may be called radiographically\
      \ involved; cN-positive or suspicious/concerning nodes are clinically suspected,\
      \ not confirmed. Copy distant information only from 'Distant Metastasis' with\
      \ the SAME sites and certainty; this field must never add a distant site or\
      \ make it more certain. Exclude N0/NX, negative/benign/reactive/granulomatous\
      \ nodes, conditional statements, and another cancer's spread.\"\n}\n"
    Clinical_Findings: 'EXTRACTION OVER INFERENCE — read before the task below:

      1. Extract what the note actually states for this field. Do not summarize it
      away or infer a conclusion the note does not support.

      2. When you are NOT confident, do NOT force a tidy ''none / no / not mentioned
      / no change'' answer. If the note contains anything relevant to this field,
      extract and list that concrete detail and let the reader judge. Only use a ''none''/''not
      mentioned'' fallback when the note genuinely contains nothing for this field.

      3. When you do make an inference you are confident about, put it in (parentheses)
      so it is clearly marked as inferred rather than stated in the note.


      TASK: Extract clinical findings and current disease status from this visit.


      Summarize NEW clinical findings or current disease status. Include:

      - Key pathology results: tumor size, margins, node status, grade

      - Imaging findings: CT, MRI, PET, bone scan results

      - Physical exam findings: palpable masses, skin changes, lymphadenopathy

      IMPORTANT: Include ALL imaging findings, even those of uncertain significance
      (e.g., "focal uptake in 6th rib of unclear significance"). Ambiguous findings
      may indicate early metastasis and must NOT be omitted. If the report says "unclear
      significance" or "indeterminate", include it with that qualifier.

      Do NOT write only symptoms (e.g., "patient reports fatigue") — write OBJECTIVE
      findings.

      Do NOT repeat the cancer type or stage (those are extracted separately).


      Respond *only* with a JSON object using this exact schema:

      {

      "findings": "Summary of new findings or disease status including pathology results,
      imaging findings, and exam findings."

      }

      '
    Current_Medications: "EXTRACTION OVER INFERENCE — read before the task below:\n\
      1. Extract what the note actually states for this field. Do not summarize it\
      \ away or infer a conclusion the note does not support.\n2. When you are NOT\
      \ confident, do NOT force a tidy 'none / no / not mentioned / no change' answer.\
      \ If the note contains anything relevant to this field, extract and list that\
      \ concrete detail and let the reader judge. Only use a 'none'/'not mentioned'\
      \ fallback when the note genuinely contains nothing for this field.\n3. When\
      \ you do make an inference you are confident about, put it in (parentheses)\
      \ so it is clearly marked as inferred rather than stated in the note.\n\nTASK:\
      \ Extract current oncologic medications the patient is ACTIVELY taking now.\n\
      \nCRITICAL — distinguish CURRENT from PLANNED from PAST:\n- CURRENT (include):\
      \ medications the patient is ACTIVELY taking right now.\n  Look for: \"continue\"\
      , \"currently on\", \"taking daily\", \"on [drug] since [date]\"\n- If the HPI\
      \ mentions one drug (e.g., \"started tamoxifen\") but the Assessment/Plan says\
      \ a DIFFERENT\n  drug as current (e.g., \"continuing on anastrozole\"), prefer\
      \ the Assessment/Plan — it reflects the\n  most recent clinical decision. Do\
      \ NOT list both unless the note clearly says both are concurrent.\n- PLANNED/RECOMMENDED\
      \ (do NOT include): medications discussed, recommended, or scheduled to start.\n\
      \  Look for: \"will start\", \"plan to begin\", \"recommend\", \"discussed\"\
      , \"Rx sent\", \"after [condition]\", \"[drug] planned\", \"planned [drug]\"\
      , \"followed by [drug]\"\n  Example: \"currently on AC and taxol planned\" →\
      \ AC is CURRENT, taxol is PLANNED → only include AC\n  Example: \"AC followed\
      \ by taxol\" → AC is CURRENT, taxol is FUTURE → only include AC\n- PAST/COMPLETED\
      \ (do NOT include): medications already finished or stopped.\n  Look for: \"\
      completed\", \"s/p\", \"stopped\", \"discontinued\", \"held\", \"finished [N]\
      \ cycles\"\n- STOPPED/DROPPED (do NOT include): medications recently discontinued.\n\
      \  Look for: \"recently dropped\", \"stopped due to\", \"discontinued\", \"\
      held\", \"self D/C\", \"D/Ced\"\n\nFocus ONLY on ACTIVE ANTICANCER medications:\
      \ chemotherapy, hormonal/endocrine therapy, targeted therapy, and immunotherapy.\n\
      Do NOT include general medications like blood pressure, diabetes, psychiatric,\
      \ allergy, antibiotic, vitamin, or supplement medications.\nIMPORTANT: Supportive\
      \ medications are NOT current_meds. Put anti-nausea drugs, pain medicines,\n\
      growth factors, bone-protecting agents, steroids used only for supportive care,\
      \ and similar drugs\nin Treatment_Changes.supportive_meds instead.\nDo NOT include:\
      \ eye drops, blood pressure meds, diabetes meds, vitamins, allergy meds, or\
      \ other non-cancer medications — even if they appear in the medication list.\n\
      If no anticancer medications are currently active, write empty string \"\".\n\
      \nCROSS-REFERENCE: If a \"Current Outpatient Medications\" or \"Current Medications\"\
      \ section exists in the note, use it as your primary reference for verifying\
      \ which drugs are current. If a drug is in the medication list but described\
      \ elsewhere as stopped/held, do NOT include it.\n- SELF-MANAGED/UNAUTHORIZED:\
      \ If the patient obtained medications outside the clinical system (e.g., from\
      \ another country, alternative medicine clinic, self-administered at home without\
      \ physician supervision), and the treating physician does NOT endorse or manage\
      \ these drugs (look for skeptical language like \"apparently\", \"so-called\"\
      , \"claims to be taking\", or \"discontinue our medications\"), do NOT list\
      \ them in current_meds. Instead, these should go in recent_changes with appropriate\
      \ context.\nIMPORTANT EXCEPTION: Clinic-administered drugs (IV chemotherapy,\
      \ injections like leuprolide/zoladex/lupron, infusions) are often NOT listed\
      \ in the outpatient medication list. If the Assessment/Plan explicitly states\
      \ the patient is CURRENTLY ON a drug (e.g., \"on irinotecan\", \"continues leuprolide\"\
      , \"started [drug] on [date]\" with no discontinuation), include it even if\
      \ it does not appear in the outpatient medication list.\nIMPORTANT: Search the\
      \ ENTIRE A/P for drug names. Common patterns: \"on leuprolide (OS started [date])\"\
      , \"continues [drug]\", \"currently on [drug]\". List ALL cancer-related drugs,\
      \ including ovarian suppression (leuprolide, zoladex/goserelin) when used as\
      \ endocrine therapy.\nIMPORTANT: If the patient SKIPPED, CANCELLED, or MISSED\
      \ a single dose/cycle of chemotherapy (e.g., \"Day 8 cancelled\", \"missed day\
      \ 8\"), they are still ON that chemotherapy. Missing one infusion does NOT mean\
      \ the drug is stopped. Only consider a drug STOPPED if the note says \"discontinued\"\
      , \"stopped\", \"changed to [other drug]\", or \"completed [N] cycles\".\nIMPORTANT:\
      \ Look for the chemo drug name in the HPI OPENING LINE. Phrases like \"on Gemzar\"\
      , \"on irinotecan\", \"on Taxol\", \"on AC\", \"started [drug] on [date]\" in\
      \ the HPI mean the patient IS currently on that drug — include it even if the\
      \ drug is not in the outpatient medication list and even if today's dose was\
      \ cancelled/skipped.\n\nRespond *only* with a JSON object using this exact schema:\n\
      {\n\"current_meds\": \"List of active anticancer medications the patient is\
      \ taking or receiving now, or empty string if none. Supportive medications belong\
      \ in supportive_meds.\"\n}\n"
    Lab_Results: 'EXTRACTION OVER INFERENCE — read before the task below:

      1. Extract what the note actually states for this field. Do not summarize it
      away or infer a conclusion the note does not support.

      2. When you are NOT confident, do NOT force a tidy ''none / no / not mentioned
      / no change'' answer. If the note contains anything relevant to this field,
      extract and list that concrete detail and let the reader judge. Only use a ''none''/''not
      mentioned'' fallback when the note genuinely contains nothing for this field.

      3. When you do make an inference you are confident about, put it in (parentheses)
      so it is clearly marked as inferred rather than stated in the note.


      TASK: Extract lab results from this medical note.


      List SPECIFIC lab values with numbers (e.g., "Hgb 7.7, Albumin 2.1, Alk Phos
      183, CA 27.29 = 48").

      Include tumor markers (CA 15-3, CA 27.29, CEA) — these ARE lab values.

      Do NOT include: imaging results (CT, MRI, PET, bone scan, echocardiogram/LVEF),
      pathology receptor status (ER%, PR%, HER2 IHC/FISH), genomic test results (Oncotype,
      MammaPrint).

      CRITICAL: Only include lab values that are EXPLICITLY written in the note with
      specific numbers. Do NOT invent or guess lab values. If no lab results appear
      anywhere in the note, write "No labs in note."

      IMPORTANT: Search the ENTIRE note for lab values — they may appear in a RESULTS
      section, not just near the Assessment/Plan. Look for sections labeled "RESULTS",
      "Labs", "Component Value", or tables with lab names and numeric values.

      IMPORTANT: When multiple lab panels from different dates exist in the note,
      report the MOST RECENT set.

      IMPORTANT: You MUST return the "lab_summary" key in your JSON. Do NOT return
      an empty object {}.

      CRITICAL: If lab values are redacted or masked (the ACTUAL NUMBERS are replaced
      with *****, [REDACTED], or similar placeholders), write "Values redacted" —
      do NOT fabricate or guess specific numbers. Only report values you can clearly
      read.

      Example: If the note says "Platelet *****" or "WBC *****", write "Lab values
      redacted" — do NOT write "Platelet 217" or any invented number.

      Example: If labs section shows "CBC: ***** ***** *****", write "CBC values redacted"
      — do NOT fill in numbers.

      IMPORTANT: "Values redacted" means the NUMBERS THEMSELVES are replaced by *****.
      If you can READ specific numeric values (e.g., "118", "9.9", "172"), those are
      NOT redacted — extract them normally.

      Some notes have ***** in reference ranges, flags, or column formatting (e.g.,
      "118 (*****)" or "9.9 (*****)") — the value itself is still readable, so report
      it.

      Only write "Values redacted" when the actual numeric results are completely
      masked and unreadable.

      IMPORTANT: If the ONLY lab values in the note are from more than 6 months before
      the visit date, write "No labs in note" — old labs are not relevant to the current
      visit. Do NOT write "Values redacted" for labs from years ago.

      IMPORTANT: If lab results are older than 6 months from the visit date but there
      are also recent labs, note the date for old results.

      Example: "Hgb 10.7, WBC 3.16 (from 01/29/2021)" — do NOT omit the date for old
      labs.

