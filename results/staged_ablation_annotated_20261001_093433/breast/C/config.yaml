      \ is NOT the same as \"mucinous\" (mucus-producing). Do NOT confuse these.\n\
      \    - \"Metaplastic carcinoma with squamous differentiation\" = \"a rare type\
      \ of breast cancer where the cells look like skin cells\"\n    - When describing\
      \ imaging results, check if the finding is CURRENT or HISTORICAL. Do NOT present\
      \ old imaging as new information if the condition has since been treated (e.g.,\
      \ do NOT say \"the cancer in your jaw has grown\" if the jaw was subsequently\
      \ treated with radiation and improved).\n17. MEDICAL TERMS — explain these if\
      \ they appear:\n    - lobular carcinoma = \"cancer that started in the milk-producing\
      \ glands\"\n    - ductal carcinoma = \"cancer that started in the milk ducts\"\
      \n    - mucinous carcinoma = \"a type of cancer that makes mucus\"\n    - neoadjuvant\
      \ = \"treatment given before surgery to shrink the cancer\"\n    - adjuvant\
      \ = \"treatment given after surgery to prevent the cancer from coming back\"\
      \n    - seroma = \"a pocket of clear fluid that can form after surgery\"\n \
      \   - peritoneum = \"the lining of the abdomen (belly area)\"\n    - axilla/axillary\
      \ = \"armpit area\"\n    - lumpectomy = \"surgery to remove the tumor\"\n  \
      \  - mastectomy = \"surgery to remove the breast\"\n    - ALND = \"surgery to\
      \ remove and check the lymph nodes under the arm\"\n    - oophorectomy/BSO =\
      \ \"surgery to remove the ovaries\"\n18. EMOTIONAL SUPPORT:\n    - If the input\
      \ JSON contains an \"emotional_context\" field with a NON-EMPTY value, add this\
      \ EXACT sentence near the closing:\n      \"We understand that this is a challenging\
      \ time and that managing these health changes can be stressful. We want to reinforce\
      \ that you are not alone in this process.\"\n    - Do NOT name specific emotions.\
      \ Do NOT say \"anxious\", \"depressed\", \"scared\", or similar.\n    - If there\
      \ is NO \"emotional_context\" field or it is empty, do NOT add ANY emotional\
      \ support sentences.\n\nTEMPLATE (fill in each section based on the mapped fields):\n\
      \nDear Patient, [source:none]\nWe hope you are doing well. We are writing this\
      \ letter to help you understand what happened during your recent visit. [source:none]\n\
      \n**Why did you come to the clinic?**\n[Fill from: summary, Patient type — e.g.\
      \ \"You came in for a follow-up visit regarding your breast cancer treatment.\"\
      ]\n[IMPORTANT: Do NOT use medical jargon in this section. Replace abbreviations\
      \ like TCHP, AC, ALND with plain words.]\n[KEEP THIS SECTION SHORT: 1-2 sentences\
      \ ONLY. State the visit type (follow-up, new consult, second opinion) and the\
      \ general reason (breast cancer treatment). Do NOT include tumor details (size,\
      \ grade, lymph nodes, receptors) here — save those for \"What's new or changed\"\
      \ section. Avoid repeating information across sections.]\n\n**What's new or\
      \ changed since your last visit?**\n[Fill from: findings, response_assessment,\
      \ lab_summary (only if ABNORMAL), goals_of_treatment]\n[CRITICAL — FOLLOW-UP\
      \ vs NEW PATIENT:\n - If Patient type is \"Follow up\": assume the patient ALREADY\
      \ understands their primary diagnosis (cancer type, stage, metastasis). Do NOT\
      \ repeat the diagnosis. Only include:\n   * New test results — only if abnormal\
      \ or if results changed management\n   * Disease progression or regression (from\
      \ response_assessment)\n   * A topic the patient explicitly raised (from findings)\n\
      \   * Do NOT list routine recurring tests with normal results\n - If Patient\
      \ type is \"New patient\": include primary diagnosis information (Type_of_Cancer,\
      \ Stage_of_Cancer, Metastasis, Distant Metastasis) since this is the first time\
      \ the patient is learning about their diagnosis.\n   * GOALS_OF_TREATMENT: Only\
      \ include if the original note EXPLICITLY states the treatment goal (e.g., \"\
      treatment would be palliative\", \"curative intent\"). Do NOT include inferred\
      \ goals — if the extraction says \"curative\" but the note never uses that word,\
      \ SKIP the goal statement.]\n[STAGING: If Stage_of_Cancer says \"Originally\
      \ X, now Y\" BUT Metastasis is \"No\" and response_assessment shows no recurrence,\
      \ this is a STAGING UPDATE, NOT disease progression. Do NOT imply worsening.]\n\
      [METASTASIS: If cancer has spread to 3+ sites, say \"has spread to other parts\
      \ of your body\" without listing every organ. Only name specific sites if there\
      \ are 1-2 sites (e.g. \"has spread to your bones\").]\n[LYMPH NODE ACCURACY:\
      \ If Metastasis is \"No\" and Distant Metastasis is \"No\", do NOT say \"cancer\
      \ has spread to lymph nodes\" UNLESS the pathology section of findings explicitly\
      \ says lymph nodes are positive (e.g., \"2/5 LN positive\", \"metastatic carcinoma\
      \ in lymph node\"). Enlarged lymph nodes on IMAGING alone (e.g., \"axillary\
      \ lymphadenopathy on CT/PET\") do NOT mean the cancer has spread there — they\
      \ may be reactive or benign. Check pathology, not just imaging.]\n[CRITICAL:\
      \ If response_assessment mentions BOTH stable AND new/progressing areas, you\
      \ MUST mention both.]\n\n**What treatment or medication changes were made?**\n\
      [Fill from: recent_changes, medication_plan, current_meds, supportive_meds,\
      \ therapy_plan, radiotherapy_plan]\n[IMPORTANT: Include ALL medication changes\
      \ from medication_plan — list EVERY medication mentioned there, regardless of\
      \ whether it relates to the primary cancer diagnosis. Include non-oncology medications\
      \ if they were changed.]\n[Include the REASON for each treatment change when\
      \ available (e.g., \"due to side effects\", \"because the cancer has progressed\"\
      , \"to help with nausea\").]\n[Include medications that are relevant to today's\
      \ visit. Exclude medications with no changes that are unrelated to today's visit\
      \ topics.]\n[Combine overlapping drug info into one mention. No dosing details.]\n\
      \n**What is the plan going forward?**\n[Fill from: radiotherapy_plan, procedure_plan,\
      \ imaging_plan, lab_plan, genetic_testing_plan, follow up, Specialty, Others,\
      \ Nutrition, Genetics, Advance care]\n[Include ALL planned future actions:\n\
      \ - Radiation treatment plans\n - Procedure/surgery plans\n - Imaging studies\
      \ (CT, MRI, PET, bone scan, mammogram, echocardiogram, etc.)\n - Lab tests planned\n\
      \ - Genetic testing plans\n - Referrals: \"You are referred to...\" not \"We\
      \ will refer you to...\"\n - Follow-up visit timing\n - Advance care status\
      \ if meaningful (Full code, DNR/DNI, surrogate)]\n[DECIDED vs DISCUSSED: Only\
      \ include plans that were DECIDED or ORDERED. If a treatment was discussed but\
      \ NOT decided upon (e.g., \"we discussed the role of radiation\" without a specific\
      \ plan to proceed), do NOT present it as a definite plan. Instead, if the patient\
      \ made a specific treatment CHOICE (e.g., \"patient prefers hormonal therapy\
      \ alone\"), highlight that choice.]\n[KEY TIMING: Always include specific timing\
      \ information for next steps:\n - When is the next treatment cycle? (e.g., \"\
      cycle 4 in 1 week\")\n - When is restaging planned? (e.g., \"scans again in\
      \ 3 months\")\n - When is the next visit?\n These timing details help the patient\
      \ plan ahead and should never be omitted.]\n\n[If emotional_context is present,\
      \ add EXACTLY: \"We understand that this is a challenging time and that managing\
      \ these health changes can be stressful. We want to reinforce that you are not\
      \ alone in this process.\" [source:emotional_context]]\nThank you for trusting\
      \ us with your care. [source:none]\nPlease feel free to contact us if you have\
      \ any questions. [source:none]\nSincerely, Your Care Team [source:none]\n\n\
      AVAILABLE FIELD NAMES (only use these in [source:] tags):\n- Patient type, second\
      \ opinion, in-person, summary\n- Type_of_Cancer, Stage_of_Cancer, Distant Metastasis,\
      \ Metastasis\n- lab_summary\n- findings\n- current_meds\n- recent_changes, supportive_meds\n\
      - goals_of_treatment\n- response_assessment\n- medication_plan, therapy_plan,\
      \ radiotherapy_plan\n- procedure_plan\n- imaging_plan\n- lab_plan\n- genetic_testing_plan\n\
      - Nutrition, Genetics, Specialty (radiation oncology, etc.), Others (social\
      \ work, home health, PT), follow up\n- Advance care\n- emotional_context\n\n\
      OUTPUT FORMAT:\n- Write PLAIN TEXT only. Do NOT wrap the output in JSON, quotes,\
      \ or any other format.\n- Every sentence MUST end with [source:field_name] before\
      \ the next sentence begins.\n- Keep the section headers (**Why did you come\
      \ to the clinic?** etc.) exactly as shown.\n\nINPUT JSON:\n{keypoints_json}\n\
      \nWrite the letter now. Plain text with [source:field_name] after EVERY sentence.\
      \ No JSON wrapper.\n"
