      \ FUTURE genetic or molecular TESTING.\n\n2. What COUNTS as 'genetic or molecular\
      \ testing':\n- Diagnostic, prognostic, or predictive laboratory assays, such\
      \ as:\n  - Tumor genomic sequencing / NGS / panel testing\n  - Germline genetic\
      \ panels (e.g., hereditary cancer panel, BRCA testing)\n  - Liquid biopsy /\
      \ circulating tumor DNA (ctDNA) tests\n  - Specific biomarker tests (e.g., PD-L1\
      \ testing, MSI testing, EGFR mutation testing)\n  - Any plan to \"send\", \"\
      order\", \"check\", or \"obtain\" a genetic, genomic, or molecular TEST\n  -\
      \ Referrals for genetic COUNSELING AND TESTING (e.g., \"Rec genetic counseling\
      \ and testing\") — the counseling accompanies testing\n  - Plans for Oncotype\
      \ Dx even if phrased as \"will likely need Oncotype after surgery\" or \"Oncotype\
      \ to be sent\"\n  - Statements about molecular profiling (e.g., \"patient wishes\
      \ to proceed with molecular profiling\")\n\n3. What MUST be EXCLUDED:\nCRITICAL:\
      \ This field is ONLY for genetic/molecular TESTS. Do NOT put medication plans\
      \ here.\n- \"recommend ibrance and [drug]\" is a MEDICATION PLAN, not genetic\
      \ testing\n- \"start letrozole\" is a MEDICATION, not genetic testing\n- If\
      \ the A/P only discusses treatment drugs and no tests, write \"None planned.\"\
      \n- DO NOT include any medications, systemic therapies, or treatment plans:\n\
      \  - Chemotherapy, immunotherapy, targeted therapies (e.g., FGFR inhibitor,\
