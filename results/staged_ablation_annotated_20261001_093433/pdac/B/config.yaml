  letter_generation:
    patient_letter: "TASK: Fill in the template below to create a patient letter summarizing\
      \ their visit.\n\nRULES:\n0. KEEP THE LETTER CONCISE: aim for 800-1200 characters\
      \ total. For complex cases with many plan items, prioritize the most important\
      \ 5-6 actions rather than listing everything. The letter should fit on one page.\n\
      1. Write at an 8th-grade reading level. Use simple, everyday words.\n2. If you\
      \ must use a medical term, explain it briefly in parentheses.\n3. After EVERY\
      \ sentence, add a source tag: [source:field_name]\n   - Use the exact field\
      \ name from the input JSON.\n   - Multiple fields: [source:field1,field2]\n\
      \   - Greetings/closings: [source:none]\n4. Include all important clinical information\
      \ from the input. Do not skip fields that have real values.\n5. Do NOT add any\
      \ information not in the input JSON. Do NOT invent or generalize.\n   CRITICAL:\
      \ When the input says specific test names (e.g., \"CA 19-9\", \"hepatitis B\
      \ surface antigen\"), keep those EXACT names in the letter. Do NOT replace them\
      \ with vague terms like \"blood tests\". Accuracy comes first.\n6. PRESERVE\
      \ SPECIFIC NAMES: Keep exact names for drugs, lab tests, imaging studies, and\
      \ procedures from the input JSON. You may add a brief plain-language explanation\
      \ in parentheses, but do NOT replace the original term.\n   - GOOD: \"Your CA\
      \ 19-9 (a tumor marker) level has decreased.\"\n   - BAD: \"Your blood tests\
      \ show improvement.\"\n7. Do NOT include exact dosing details (mg, mg/m2, schedules).\
      \ Just name the treatment.\n   EXCEPTION: If the input says a dose was \"reduced\
      \ to X\" or \"increased to X\", you MUST include the target value. \"Your dose\
      \ was reduced to 7.5 mg\" is correct. \"Your dose was reduced to\" with no number\
      \ is WRONG — it creates an incomplete sentence.\n   Do NOT include exact tumor\
      \ measurements (e.g., \"4.9 x 4.2 cm\", \"3.6 x 2.8 cm\"). Instead say \"the\
      \ tumor has stayed the same size\" or \"the tumor has gotten smaller/larger\"\
      . Exact measurements belong in the medical record, not in a patient letter.\n\
      8. Do NOT repeat the same information across sections. If two fields say the\
      \ same thing, mention it once.\n9. Use passive/neutral voice: \"You are referred\
      \ to\" NOT \"We will refer you to\".\n   CRITICAL VOICE RULE: Always write in\
      \ second person (\"you\", \"your\"). NEVER use third person (\"he\", \"she\"\
      , \"the patient\"). If the extraction data uses \"he/she/patient\", convert\
      \ it to \"you/your\" in the letter.\n10. If a section has no relevant data (all\
      \ fields empty/N/A), skip that section entirely.\n11. LAB VALUES:\n    - If\
      \ lab_summary says \"No labs in note\" → do NOT mention blood tests at all.\n\
      \    - Only mention ABNORMAL lab results that are clinically significant.\n\
      \    - Do NOT list routine recurring tests unless results changed management.\n\
      12. ADVANCE CARE — only include if there is meaningful content (Full code, DNR,\
      \ surrogate). Skip if \"Not discussed\".\n13. RESPONSE ASSESSMENT — If results\
      \ are mixed (some stable, some progressing), mention BOTH.\n14. HANDLING [REDACTED]\
      \ CONTENT:\n    - If a field value is mostly [REDACTED], SKIP that information\
      \ rather than generating garbled text.\n    - NEVER call a test a \"medication\
      \ test\" or \"medication testing\". If the test name is [REDACTED], say \"a\
      \ test\" or \"a genomic test\".\n    - If [REDACTED] appears where a FACILITY\
      \ or LOCATION name should be, write \"your clinic\" or \"your treatment center\"\
      .\n15. PHYSICAL EXAM FINDINGS:\n    - Only include PE findings that are RELEVANT\
      \ to the cancer or changed since last visit.\n    - Do NOT include chronic,\
      \ pre-existing conditions unrelated to cancer unless they affect the cancer\
      \ treatment plan.\n16. FACTUAL ACCURACY:\n    - When describing imaging results,\
      \ check if the finding is CURRENT or HISTORICAL. Do NOT present old imaging\
      \ as new information.\n17. MEDICAL TERMS — explain these if they appear:\n \
      \   - adenocarcinoma = \"a type of cancer that forms in gland cells\"\n    -\
      \ pancreatic ductal adenocarcinoma = \"cancer of the pancreas\"\n    - neoadjuvant\
      \ = \"treatment given before surgery to shrink the cancer\"\n    - adjuvant\
      \ = \"treatment given after surgery to prevent the cancer from coming back\"\
      \n    - Whipple procedure = \"surgery to remove part of the pancreas, small\
      \ intestine, and nearby tissues\"\n    - distal pancreatectomy = \"surgery to\
      \ remove the tail end of the pancreas\"\n    - biliary stent = \"a small tube\
      \ placed to keep the bile duct open\"\n    - peritoneum = \"the lining of the\
      \ abdomen (belly area)\"\n    - ascites = \"fluid buildup in the belly area\"\
      \n    - FOLFIRINOX = \"a combination of chemotherapy drugs\"\n    - gemcitabine/nab-paclitaxel\
      \ = \"a combination of chemotherapy drugs\"\n18. EMOTIONAL SUPPORT:\n    - If\
      \ the input JSON contains an \"emotional_context\" field with a NON-EMPTY value,\
      \ add this EXACT sentence near the closing:\n      \"We understand that this\
      \ is a challenging time and that managing these health changes can be stressful.\
      \ We want to reinforce that you are not alone in this process.\"\n    - Do NOT\
      \ name specific emotions.\n    - If there is NO \"emotional_context\" field\
      \ or it is empty, do NOT add ANY emotional support sentences.\n\nTEMPLATE (fill\
      \ in each section based on the mapped fields):\n\nDear Patient, [source:none]\n\
      We hope you are doing well. We are writing this letter to help you understand\
      \ what happened during your recent visit. [source:none]\n\n**Why did you come\
      \ to the clinic?**\n[Fill from: summary, Patient type — e.g. \"You came in for\
      \ a follow-up visit regarding your cancer treatment.\"]\n[IMPORTANT: Do NOT\
      \ use medical jargon in this section.]\n[KEEP THIS SECTION SHORT: 1-2 sentences\
      \ ONLY. State the visit type and the general reason. Do NOT include tumor details\
      \ here — save those for \"What's new or changed\" section.]\n[CANCER TYPE: Use\
      \ the ACTUAL cancer type from Type_of_Cancer field. Do NOT default to \"pancreatic\
      \ cancer\" — the tumor may be duodenal, ampullary, biliary, or another origin.\
      \ Examples:\n - If Type_of_Cancer says \"pancreatic adenocarcinoma\" → \"your\
      \ pancreatic cancer\"\n - If Type_of_Cancer says \"neuroendocrine tumor\" →\
      \ \"your neuroendocrine tumor\"\n - If Type_of_Cancer says \"neuroendocrine\
      \ tumor of duodenal origin\" → \"your duodenal neuroendocrine tumor\"\n - If\
      \ Type_of_Cancer says \"adenocarcinoma of pancreaticobiliary origin\" → \"your\
      \ cancer\"]\n\n**What's new or changed since your last visit?**\n[Fill from:\
      \ findings, response_assessment, lab_summary (only if ABNORMAL), goals_of_treatment]\n\
      [CRITICAL — FOLLOW-UP vs NEW PATIENT:\n - If Patient type is \"Follow up\":\
      \ assume the patient ALREADY understands their primary diagnosis. Only include:\n\
      \   * New test results — only if abnormal or if results changed management\n\
      \   * Disease progression or regression (from response_assessment)\n   * Do\
      \ NOT list routine recurring tests with normal results\n - If Patient type is\
      \ \"New patient\": include primary diagnosis information (Type_of_Cancer, Stage_of_Cancer,\
      \ Metastasis, Distant Metastasis).\n   * GOALS_OF_TREATMENT: Only include if\
      \ the original note EXPLICITLY states the treatment goal. Do NOT include inferred\
      \ goals.]\n\n**What treatment or medication changes were made?**\n[Fill from:\
      \ recent_changes, medication_plan, current_meds, supportive_meds, therapy_plan,\
      \ radiotherapy_plan]\n[Include ALL medication changes from medication_plan.]\n\
      [Include the REASON for each treatment change when available.]\n[Combine overlapping\
      \ drug info into one mention. No dosing details.]\n\n**What is the plan going\
      \ forward?**\n[Fill from: radiotherapy_plan, procedure_plan, imaging_plan, lab_plan,\
      \ genetic_testing_plan, follow up, Specialty, Others, Nutrition, Genetics, Advance\
      \ care]\n[Include ALL planned future actions.]\n[DECIDED vs DISCUSSED: Only\
      \ include plans that were DECIDED or ORDERED.]\n[KEY TIMING: Always include\
      \ specific timing information for next steps:\n - When is the next treatment\
      \ cycle?\n - When is restaging planned?\n - When is the next visit?]\n\n[If\
      \ emotional_context is present, add EXACTLY: \"We understand that this is a\
      \ challenging time and that managing these health changes can be stressful.\
      \ We want to reinforce that you are not alone in this process.\" [source:emotional_context]]\n\
      Thank you for trusting us with your care. [source:none]\nPlease feel free to\
      \ contact us if you have any questions. [source:none]\nSincerely, Your Care\
      \ Team [source:none]\n\nAVAILABLE FIELD NAMES (only use these in [source:] tags):\n\
      - Patient type, second opinion, in-person, summary\n- Type_of_Cancer, Stage_of_Cancer,\
      \ Distant Metastasis, Metastasis\n- lab_summary\n- findings\n- current_meds\n\
      - recent_changes, supportive_meds\n- goals_of_treatment\n- response_assessment\n\
      - medication_plan, therapy_plan, radiotherapy_plan\n- procedure_plan\n- imaging_plan\n\
      - lab_plan\n- genetic_testing_plan\n- Nutrition, Genetics, Specialty, Others,\
      \ follow up\n- Advance care\n- emotional_context\n\nOUTPUT FORMAT:\n- Write\
      \ PLAIN TEXT only. Do NOT wrap the output in JSON, quotes, or any other format.\n\
      - Every sentence MUST end with [source:field_name] before the next sentence\
      \ begins.\n- Keep the section headers (**Why did you come to the clinic?** etc.)\
      \ exactly as shown.\n\nINPUT JSON:\n{keypoints_json}\n\nWrite the letter now.\
      \ Plain text with [source:field_name] after EVERY sentence. No JSON wrapper.\n"
