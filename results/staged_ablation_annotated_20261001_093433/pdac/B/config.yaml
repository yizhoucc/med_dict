    Cancer_Diagnosis: "EXTRACTION OVER INFERENCE — read before the task below:\n1.\
      \ Extract what the note actually states for this field. Do not summarize it\
      \ away or infer a conclusion the note does not support.\n2. When you are NOT\
      \ confident, do NOT force a tidy 'none / no / not mentioned / no change' answer.\
      \ If the note contains anything relevant to this field, extract and list that\
      \ concrete detail and let the reader judge. Only use a 'none'/'not mentioned'\
      \ fallback when the note genuinely contains nothing for this field.\n3. When\
      \ you do make an inference you are confident about, put it in (parentheses)\
      \ so it is clearly marked as inferred rather than stated in the note.\n\nTASK:\
      \ Extract cancer diagnosis details.\n\nFor Type_of_Cancer, be MAXIMALLY SPECIFIC\
      \ — include ALL of the following that the note provides:\n1. Histologic subtype:\
      \ adenocarcinoma, neuroendocrine tumor/carcinoma, acinar cell carcinoma, squamous\
      \ cell carcinoma, melanoma, etc.\n2. Grade (e.g., \"grade 2\", \"G3\", \"high\
      \ grade\", \"well-differentiated\", \"poorly differentiated\") — ALWAYS include\
      \ if mentioned anywhere in the note\n3. Special features: perineural invasion,\
      \ lymphovascular invasion, signet ring features, etc.\n4. If this is a recurrence\
      \ or metastatic disease, mention that without adding any site not stated in\
      \ the note\n5. TUMOR ORIGIN: Write the EXACT organ/site of origin as stated\
      \ in the note. Do NOT assume \"pancreatic\" — the tumor may originate from:\
      \ pancreas, duodenum, ampulla, bile duct, stomach, or other sites. Write what\
      \ the note says.\n6. MULTIPLE CANCERS: If the patient has more than one cancer\
      \ (e.g., pancreatic NET AND melanoma), list ALL cancers separated by semicolons.\
      \ Example: \"Pancreatic neuroendocrine tumor; BRAF-mutant metastatic melanoma\"\
      \n- Example: \"Poorly differentiated pancreatic ductal adenocarcinoma with perineural\
      \ invasion\"\n- Example: \"Pancreatic neuroendocrine tumor, grade 2, well-differentiated\"\
      \n- Example: \"High-grade neuroendocrine tumor of duodenal/ampullary origin\"\
      \n- Example: \"Pancreatic NET; BRAF-mutant melanoma (two separate primary cancers)\"\
      \nDo NOT write just \"pancreatic cancer\" — always include the subtype and grade\
      \ when available in the note.\nIMPORTANT: Search the ENTIRE note for diagnosis\
      \ details — they may appear in PMH, Problem List, Pathology, HPI, Assessment/Plan,\
      \ or Diagnosis section.\n\nFor Stage_of_Cancer:\n- Write the AJCC/TNM stage\
      \ if stated (e.g., \"Stage IIB\", \"T3N1M0\", \"Stage IV\")\n- If the patient\
      \ was originally diagnosed at one stage but now has metastatic recurrence, write\
      \ BOTH:\n  e.g., \"Originally Stage IIB, now metastatic (Stage IV)\"\n  IMPORTANT:\
      \ Only write \"Originally Stage [X]\" if the note EXPLICITLY states the original\
      \ stage number. If the note only says \"metastatic recurrence\" without specifying\
      \ the original stage, write just \"Metastatic (Stage IV)\" — do NOT guess.\n\
      - If distant metastases are documented, the current stage is Stage IV even if\
      \ not explicitly stated.\n- If the Assessment/Plan states a stage, extract it\
      \ — do NOT write \"Not mentioned in note\".\n- Pancreatic cancer staging considerations:\n\
      \  - Resectable vs borderline resectable vs locally advanced vs metastatic is\
      \ a key classification\n  - \"Locally advanced\" is a resectability/extent description,\
      \ NOT automatically an AJCC Stage III label. Preserve it as \"Locally advanced\"\
      \ or \"Locally advanced (unresectable)\" when supported. Write \"Stage III\"\
      \ only if the note explicitly states Stage III.\n  - Vascular involvement (SMA,\
      \ SMV, celiac axis, portal vein) determines resectability\n  - If tumor involves\
      \ major vessels and is described as \"unresectable\" or \"locally advanced\"\
      , record that descriptive status without inventing a numeric stage.\n- RESECTED\
      \ METASTASIS + NED: If a patient had prior metastasis that was surgically resected\
      \ and current imaging shows NO evidence of disease (NED), do NOT write \"now\
      \ metastatic (Stage IV)\". Instead write the CURRENT status: e.g., \"Originally\
      \ Stage IB, had pulmonary metastasis (resected 2017), currently no evidence\
      \ of disease\". The staging should reflect the CURRENT clinical reality.\n-\
      \ CRITICAL — DO NOT FABRICATE STAGE NUMBERS:\n  * Only write \"Stage IA\", \"\
      Stage IB\", \"Stage IIA\", \"Stage IIB\", \"Stage III\", \"Stage IV\" if the\
      \ note EXPLICITLY uses that exact stage designation.\n  * If the note says \"\
      Stage IB\", write \"Stage IB\" — do NOT change it to \"Stage IIB\".\n  * If\
      \ the note has pTN notation (e.g., \"pT3N1\") but does NOT state a stage name,\
      \ write the pTN notation: \"pT3N1\" — do NOT convert to \"Stage IIB\" or any\
      \ AJCC stage name. The conversion from pTN to AJCC stage requires clinical judgment\
      \ and should NOT be done by extraction.\n  * If the note mentions NO stage and\
      \ NO pTN, write \"Not staged in note\" or describe what IS available (e.g.,\
      \ \"Metastatic disease at diagnosis\", \"Borderline resectable\").\n  * Common\
      \ mistake: writing \"Originally Stage IIB\" when the note never says \"IIB\"\
      . This is FABRICATION.\n  * Another common mistake: the note says \"pT3 N1\"\
      \ and you write \"Originally Stage IIB\". pT3N1 is NOT the same as \"Stage IIB\"\
      \ — do NOT make this conversion. Write \"pT3N1\" exactly as stated.\n- Only\
      \ write \"Not mentioned in note\" if there is truly NO staging or tumor information\
      \ anywhere in the note.\n\nRespond *only* with a JSON object using this exact\
      \ schema:\n{\n\"Type_of_Cancer\": \"Specific cancer type with histologic subtype\
      \ and grade when available. e.g., 'Poorly differentiated pancreatic ductal adenocarcinoma'\"\
      ,\n\"Stage_of_Cancer\": \"AJCC stage, resectability status, or original + current\
      \ if recurred/progressed. e.g., 'Stage IIB (borderline resectable)' or 'Stage\
      \ IV (metastatic)'\",\n\"Distant Metastasis\": \"DISTANT (M1) disease only.\
      \ Answer 'Yes, to [confirmed distant site(s)]', 'No', or 'Not sure/Suspected,\
      \ to [site(s)]'. Common PDAC distant sites include liver, peritoneum/omentum,\
      \ lung, and nonregional nodes. Regional nodes and direct contiguous invasion/abutment/encasement\
      \ of stomach, duodenum, spleen, adrenal, kidney, or vessels are NOT distant\
      \ metastases. Preserve certainty separately for every site: suspicious/concerning/indeterminate/pending-biopsy\
      \ sites must remain 'Not sure' or 'Suspected', never 'Yes'. Do not include benign/negative/reactive\
      \ findings or another primary cancer's spread.\",\n\"Metastasis\": \"COMPREHENSIVE\
      \ spread status: include regional nodal involvement PLUS distant (M1) disease.\
      \ Direct contiguous invasion/abutment/encasement of adjacent organs or vessels\
      \ is local extension, not metastasis. Preserve each claim's evidence level without\
      \ borrowing any organ, site, procedure, or certainty phrase from these instructions.\
      \ Call regional nodes pathologically confirmed only with p/ypN-positive staging,\
      \ a positive node count, or a positive node biopsy. Explicit imaging-described\
      \ nodal metastases may be called radiographically involved; cN-positive or suspicious/concerning\
      \ nodes are clinically suspected, not confirmed. Copy distant information only\
      \ from 'Distant Metastasis' with the SAME sites and certainty; this field must\
      \ never add a distant site or make it more certain. Exclude N0/NX, negative/benign/reactive\
      \ nodes, conditional statements, and another cancer's spread.\"\n}\n"
    Clinical_Findings: 'EXTRACTION OVER INFERENCE — read before the task below:

      1. Extract what the note actually states for this field. Do not summarize it
      away or infer a conclusion the note does not support.

      2. When you are NOT confident, do NOT force a tidy ''none / no / not mentioned
      / no change'' answer. If the note contains anything relevant to this field,
      extract and list that concrete detail and let the reader judge. Only use a ''none''/''not
      mentioned'' fallback when the note genuinely contains nothing for this field.

      3. When you do make an inference you are confident about, put it in (parentheses)
      so it is clearly marked as inferred rather than stated in the note.


      TASK: Extract clinical findings and current disease status from this visit.


      Summarize NEW clinical findings or current disease status. Include:

      - Key pathology results: tumor size, margins, node status, grade

      - Imaging findings: CT, MRI, PET, bone scan results

      - Physical exam findings: palpable masses, jaundice, ascites, weight loss

      IMPORTANT: Include ALL imaging findings, even those of uncertain significance.
      Ambiguous findings may indicate early metastasis and must NOT be omitted. If
      the report says "unclear significance" or "indeterminate", include it with that
      qualifier.

      Do NOT write only symptoms (e.g., "patient reports fatigue") — write OBJECTIVE
      findings.

      Do NOT repeat the cancer type or stage (those are extracted separately).


      Respond *only* with a JSON object using this exact schema:

      {

      "findings": "Summary of new findings or disease status including pathology results,
      imaging findings, and exam findings."

      }

      '
    Current_Medications: "EXTRACTION OVER INFERENCE — read before the task below:\n\
      1. Extract what the note actually states for this field. Do not summarize it\
      \ away or infer a conclusion the note does not support.\n2. When you are NOT\
      \ confident, do NOT force a tidy 'none / no / not mentioned / no change' answer.\
      \ If the note contains anything relevant to this field, extract and list that\
      \ concrete detail and let the reader judge. Only use a 'none'/'not mentioned'\
      \ fallback when the note genuinely contains nothing for this field.\n3. When\
      \ you do make an inference you are confident about, put it in (parentheses)\
      \ so it is clearly marked as inferred rather than stated in the note.\n\nTASK:\
      \ Extract current oncologic medications the patient is ACTIVELY taking now.\n\
      \nCRITICAL — distinguish CURRENT from PLANNED from PAST:\n- CURRENT (include):\
      \ medications the patient is ACTIVELY taking right now.\n  Look for: \"continue\"\
      , \"currently on\", \"taking daily\", \"on [drug] since [date]\"\n- If the HPI\
      \ mentions one drug but the Assessment/Plan says a DIFFERENT drug as current,\
      \ prefer the Assessment/Plan.\n- PLANNED/RECOMMENDED (do NOT include): medications\
      \ discussed, recommended, or scheduled to start.\n  Look for: \"will start\"\
      , \"plan to begin\", \"recommend\", \"discussed\", \"Rx sent\", \"after [condition]\"\
      \n- PAST/COMPLETED (do NOT include): medications already finished or stopped.\n\
      \  Look for: \"completed\", \"s/p\", \"stopped\", \"discontinued\", \"held\"\
      , \"finished [N] cycles\"\n\nFocus ONLY on ACTIVE ANTICANCER medications: chemotherapy,\
      \ targeted therapy, immunotherapy, and endocrine therapy when applicable.\n\
      Do NOT include general medications like blood pressure, diabetes, psychiatric,\
      \ allergy medications.\nIMPORTANT: Supportive medications are NOT current_meds.\
      \ Put anti-nausea drugs, pain medicines,\npancreatic enzymes, growth factors,\
      \ anticoagulants, and similar supportive drugs in\nTreatment_Changes.supportive_meds\
      \ instead.\nIf no anticancer medications are currently active, write empty string\
      \ \"\".\n\nCROSS-REFERENCE: If a \"Current Outpatient Medications\" section\
      \ exists, use it as primary reference.\nIMPORTANT EXCEPTION: Clinic-administered\
      \ drugs (IV chemotherapy, injections, infusions) may NOT be in the outpatient\
      \ medication list. If the A/P states the patient is CURRENTLY ON a drug, include\
      \ it.\nIMPORTANT: If the patient SKIPPED or MISSED a single dose/cycle, they\
      \ are still ON that drug.\nCRITICAL — DO NOT HALLUCINATE DRUG NAMES: Only list\
      \ drugs the patient is CURRENTLY TAKING. Do NOT confuse:\n- Literature citations\
      \ in the A/P (e.g., \"capecitabine/temozolomide was reported to have 70% response\
      \ rate\") — these are NOT the patient's medications\n- Future treatment options\
      \ being discussed (e.g., \"could consider everolimus\") — these are NOT current\
      \ medications\n- Past completed medications (e.g., \"s/p 6 cycles of FOLFIRINOX\"\
      ) — these are NOT current\nAlways verify: is the drug listed in the Current\
      \ Medications section OR explicitly stated as currently being administered?\n\
      IMPORTANT: If the A/P section mentions specific chemotherapy drug names being\
      \ given, continued, or dose-adjusted (e.g., \"Oxaliplatin 49 mg/m2\", \"continue\
      \ gemcitabine\", \"irinotecan reduced\"), those drugs ARE current cancer medications\
      \ — include them even if the drug names are not in the outpatient medication\
      \ list.\nIMPORTANT: If drug names are [REDACTED] or masked (*****), write \"\
      [REDACTED]\" — do NOT leave current_meds empty when the patient is clearly on\
      \ active chemotherapy.\n\nRespond *only* with a JSON object using this exact\
      \ schema:\n{\n\"current_meds\": \"List of active anticancer medications the\
      \ patient is taking or receiving now, or empty string if none. Supportive medications\
      \ belong in supportive_meds.\"\n}\n"
    Lab_Results: 'EXTRACTION OVER INFERENCE — read before the task below:

      1. Extract what the note actually states for this field. Do not summarize it
      away or infer a conclusion the note does not support.

      2. When you are NOT confident, do NOT force a tidy ''none / no / not mentioned
      / no change'' answer. If the note contains anything relevant to this field,
      extract and list that concrete detail and let the reader judge. Only use a ''none''/''not
      mentioned'' fallback when the note genuinely contains nothing for this field.

      3. When you do make an inference you are confident about, put it in (parentheses)
      so it is clearly marked as inferred rather than stated in the note.


      TASK: Extract lab results from this medical note.


      List SPECIFIC lab values with numbers (e.g., "Hgb 7.7, Albumin 2.1, Alk Phos
      183, CA 19-9 = 548").

      Include tumor markers (CA 19-9, CEA) — these ARE lab values.

      Do NOT include: imaging results (CT, MRI, PET, bone scan), pathology results,
      genomic test results.

      CRITICAL: Only include lab values that are EXPLICITLY written in the note with
      specific numbers. Do NOT invent or guess lab values. If no lab results appear
      anywhere in the note, write "No labs in note."

      IMPORTANT: Search the ENTIRE note for lab values — they may appear in a RESULTS
      section, not just near the Assessment/Plan. Look for sections labeled "RESULTS",
      "Labs", "Component Value", or tables with lab names and numeric values.

      IMPORTANT: When multiple lab panels from different dates exist in the note,
      report the MOST RECENT set.

      IMPORTANT: You MUST return the "lab_summary" key in your JSON. Do NOT return
      an empty object {}.

      CRITICAL: If lab values are redacted or masked (the ACTUAL NUMBERS are replaced
      with *****, [REDACTED], or similar placeholders), write "Values redacted" —
      do NOT fabricate or guess specific numbers.

      IMPORTANT: If the ONLY lab values in the note are from more than 6 months before
      the visit date, write "No labs in note" — old labs are not relevant to the current
      visit.


      Respond *only* with a JSON object using this exact schema:

      {

      "lab_summary": "Summary of key lab results with specific values from THIS VISIT
      ONLY. Only include blood work and tumor markers, NOT imaging/pathology/genomic
      tests. If none found, write ''No labs in note.''"

      }

      '
    Reason_for_Visit: "EXTRACTION OVER INFERENCE — read before the task below:\n1.\
      \ Extract what the note actually states for this field. Do not summarize it\
      \ away or infer a conclusion the note does not support.\n2. When you are NOT\
      \ confident, do NOT force a tidy 'none / no / not mentioned / no change' answer.\
      \ If the note contains anything relevant to this field, extract and list that\
      \ concrete detail and let the reader judge. Only use a 'none'/'not mentioned'\
      \ fallback when the note genuinely contains nothing for this field.\n3. When\
      \ you do make an inference you are confident about, put it in (parentheses)\
      \ so it is clearly marked as inferred rather than stated in the note.\n\nTASK:\
      \ Extract 'Reason for Visit'.\nBe SPECIFIC — include the patient's diagnosis,\
      \ cancer type, and the purpose of this visit.\nDo NOT give vague answers like\
      \ \"new symptoms\" or \"follow up visit\". Instead, state what cancer,\nwhat\
      \ stage (if known), and what specifically brought them in (e.g., \"initial consult\
      \ for newly\ndiagnosed pancreatic adenocarcinoma\" or \"cycle 3 day 1 of FOLFIRINOX\
      \ for metastatic PDAC\").\nCRITICAL RULE: Do NOT add, assume, or generalize\
      \ any details not in the original note.\nIf something is redacted (*****), write\
      \ \"[REDACTED]\" — do NOT guess or fill in.\nIf biopsy has not been done, do\
      \ NOT call a mass \"cancer\" — call it a \"mass\" or \"lesion\".\nIf a specific\
      \ test name is not mentioned, do NOT assume which test.\n\nFor Patient type\
      \ — determining \"New patient\" vs \"Follow up\":\n- \"New patient\" if ANY\
      \ of these apply:\n  * Note says \"New Patient Evaluation\", \"Consult Note\"\
      , \"consultation\", \"establish care\", \"referred by\", or \"second opinion\"\
      \n  * This is the patient's FIRST visit to this oncologist/clinic (even if they\
      \ had surgery or treatment elsewhere)\n  * Post-surgery first visit to medical\
      \ oncology to discuss systemic therapy\n- \"Follow up\" ONLY if the patient\
      \ has been seen by THIS provider/clinic before for ongoing management\n- When\
      \ in doubt, \"New patient\" is safer than \"Follow up\"\n\nFor second opinion\
      \ — write \"yes\" ONLY if the note explicitly mentions \"second opinion\", \"\
      another opinion\", or the patient was clearly referred for an independent review\
      \ of their case. Do NOT guess.\n\nRespond *only* with a JSON object using this\
      \ exact schema:\n{\n\"Patient type\": \"either New patient or follow up\",\n\
      \"second opinion\": \"whether the visit is consultation/second opinion or not\"\
      ,\n\"in-person\": \"either Televisit or in-person. (note, video consult, televisit,\
      \ telehealth are the same thing)\",\n\"summary\": \"A specific summary including\
      \ cancer type, stage if known, and purpose of this visit.\"\n}\n"
    Response_Assessment: "EXTRACTION OVER INFERENCE — read before the task below:\n\
      1. Extract what the note actually states for this field. Do not summarize it\
      \ away or infer a conclusion the note does not support.\n2. When you are NOT\
      \ confident, do NOT force a tidy 'none / no / not mentioned / no change' answer.\
      \ If the note contains anything relevant to this field, extract and list that\
      \ concrete detail and let the reader judge. Only use a 'none'/'not mentioned'\
      \ fallback when the note genuinely contains nothing for this field.\n3. When\
      \ you do make an inference you are confident about, put it in (parentheses)\
      \ so it is clearly marked as inferred rather than stated in the note.\n\nTASK:\
      \ Extract how the cancer is CURRENTLY responding to treatment.\n\nThink step\
      \ by step before answering:\n1. Has this patient started any cancer treatment\
      \ yet? (surgery alone does not count as \"treatment\" for response assessment\
      \ purposes)\n   CRITICAL EXCEPTION — POST-NEOADJUVANT SURGERY: If the patient\
      \ received neoadjuvant therapy BEFORE surgery, treatment-effect pathology (residual\
      \ tumor/cellularity, treated nodes, pCR, Ryan/Evans score) IS the response assessment.\
      \ Ordinary diagnostic pathology and routine postoperative changes are not.\n\
      \   IMPORTANT: Completed radiation therapy COUNTS as treatment.\n   IMPORTANT:\
      \ A patient who was on PREVIOUS treatment and now shows disease PROGRESSION\
      \ or RECURRENCE — that IS a response assessment.\n   Even if the next regimen\
      \ has not started, report the recurrence/progression factually rather than writing\
      \ only \"Not yet on treatment.\"\n2. If yes, what treatment are they on?\n3.\
      \ Is there any evidence of how the cancer is responding? Search the ENTIRE note\
      \ for ANY of these:\n   - Imaging: CT stable, PET response, scan results\n \
      \  - Tumor markers: CA 19-9, CEA rising or falling\n   - Physical exam: palpable\
      \ changes, ascites, jaundice improvement\n   - Clinical status: \"labs okay\
      \ to proceed\" (implies stable enough to continue)\n4. If no treatment started\
      \ yet, write \"Not yet on treatment — no response to assess.\"\n5. If on treatment\
      \ but no response data in the note, write \"Not mentioned in note.\"\n6. CURRENT-REGIMEN\
      \ TIME WINDOW — identify the current regimen and when it began, switched, stopped,\
      \ or was held before assigning response evidence.\n   - Imaging or marker results\
      \ from BEFORE the current regimen started describe the PRIOR regimen, not the\
      \ current regimen.\n   - If prior therapy progressed and the patient is now\
      \ early in a new regimen with no post-start assessment, state the prior progression\
      \ and explicitly say response to the current regimen is not yet assessed.\n\
      7. DISTINGUISH PRESCRIBED FROM ACTUALLY STARTED TODAY:\n   - \"will start\"\
      , \"plan to start\", \"prescribed\", \"ordered\", or \"recommend starting\"\
      \ means NOT started.\n   - \"received\", \"administered\", \"was given\", or\
      \ \"started today\" means treatment HAS started, but it is too early to assess\
      \ response.\n8. A/P ASSESSMENT TAKES PRIORITY: an explicit current physician\
      \ assessment in the A/P outranks older imaging or historical problem-list text.\
      \ Preserve nuances such as mixed response, possible progression, or stable-to-minimally\
      \ increased disease.\n\nSTRICT RULES — do NOT violate:\n- Do NOT include future\
      \ plans (\"will start\", \"plan to\").\n- Do NOT use generic boilerplate phrases.\n\
      - Do NOT write \"tolerating therapy well\" unless the note EXPLICITLY uses those\
      \ exact words.\n- Toxicity or tolerability alone (hand-foot syndrome, mucositis,\
      \ nausea, neuropathy, fatigue, dose hold) is NOT tumor response.\n- Postoperative/anatomic\
      \ changes (healing, postoperative fluid resolving, vascular narrowing resolving)\
      \ and isolated biliary changes (pneumobilia, biliary-duct dilation) are NOT\
      \ tumor response unless the physician explicitly links them to tumor change.\n\
      - Do NOT use the word \"responding\" unless you can cite SPECIFIC imaging or\
      \ tumor marker evidence.\n- IMPORTANT: \"responding\" implies MEASURABLE IMPROVEMENT.\
      \ Use \"stable disease\" for unchanged findings.\n- Use formal categories such\
      \ as \"partial response\" or \"complete response\" ONLY when the note explicitly\
      \ states that category. If the source says only \"slight decrease\" or \"minimal\
      \ decrease\", preserve that exact degree; do not upgrade it to \"partial response\"\
      .\n- Do NOT describe ordinary diagnostic pathology results as a \"response\"\
      . The only pathology exception is post-neoadjuvant treatment-effect assessment\
      \ described above.\n- Do NOT describe surgical recovery as a response assessment.\n\
      - SUSPECTED vs CONFIRMED: If imaging shows \"suspicious\" or \"concerning\"\
      \ findings that are NOT confirmed (e.g., \"suspicious for metastases\", \"concerning\
      \ for\"), do NOT write \"cancer is not responding\" or \"cancer is progressing\"\
      . Instead write \"suspicious findings that need further evaluation\" or \"findings\
      \ being monitored closely\". Only conclude progression if the physician's assessment\
      \ explicitly says \"progression\" or \"progressing\".\n\nWrite your reasoning\
      \ first, then output the JSON on a new line starting with {\nIMPORTANT: Your\
      \ JSON must contain ONLY the key \"response_assessment\". Do NOT add any other\
      \ keys.\n\nRespond with a JSON object using this exact schema (NO other keys):\n\
      {\n\"response_assessment\": \"How is the cancer CURRENTLY responding? Be DETAILED\
      \ — cite specific evidence.\"\n}\n"
    Treatment_Changes: 'EXTRACTION OVER INFERENCE — read before the task below:

      1. Extract what the note actually states for this field. Do not summarize it
      away or infer a conclusion the note does not support.

      2. When you are NOT confident, do NOT force a tidy ''none / no / not mentioned
      / no change'' answer. If the note contains anything relevant to this field,
      extract and list that concrete detail and let the reader judge. Only use a ''none''/''not
      mentioned'' fallback when the note genuinely contains nothing for this field.

      3. When you do make an inference you are confident about, put it in (parentheses)
      so it is clearly marked as inferred rather than stated in the note.


      TASK: Extract recent treatment changes and supportive medications.


      For recent_changes: Any holds, dose reductions, switches, or newly started medications
      RELATED TO THIS VISIT.

      Do NOT include changes from months or years ago.

      IMPORTANT: If the patient IS currently on treatment but there are no recent
      changes, write an empty string "".

      Do NOT write "Not yet on treatment" if the patient is already taking medication.

      "Not yet on treatment" is ONLY correct if the patient has never started any
      cancer treatment.


      For supportive_meds: List supportive care medications the patient is CURRENTLY
      TAKING that are RELATED to cancer treatment (anti-nausea, pain meds for cancer
      pain, pancreatic enzyme replacement like Creon, growth factors).


      CRITICAL rules for supportive_meds:

      - ONLY include medications the patient is actively taking RIGHT NOW.

      - Do NOT include medications that are only DISCUSSED, RECOMMENDED, or HYPOTHETICAL.

      - Do NOT include: allergies, non-cancer medications.

      - Do NOT include medications marked "Patient not taking".

      IMPORTANT: The ALLERGIES section lists what the patient is ALLERGIC TO — these
      are NOT medications they take.


      Respond *only* with a JSON object using this exact schema:

      {

      "recent_changes": "Any holds, dose reductions, or switches at or near this visit.",

      "supportive_meds": "List of cancer-treatment-related supportive medications."

      }

      '
    Treatment_Goals: "EXTRACTION OVER INFERENCE — read before the task below:\n1.\
      \ Extract what the note actually states for this field. Do not summarize it\
      \ away or infer a conclusion the note does not support.\n2. When you are NOT\
      \ confident, do NOT force a tidy 'none / no / not mentioned / no change' answer.\
      \ If the note contains anything relevant to this field, extract and list that\
